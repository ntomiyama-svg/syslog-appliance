# MVP 1.1: バックエンドは localhost のみ listen(nginx 経由のみアクセス可)
#
# 既存の ExecStart を一度クリアして、--host 127.0.0.1 に変更する。
# これにより外部から直接 :8080 へアクセスできなくなる。
# 本体 unit ファイル(syslog-appliance-backend.service)は変更しない。
[Service]
ExecStart=
ExecStart=/opt/syslog-appliance/backend/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8080 --log-level info --no-access-log
