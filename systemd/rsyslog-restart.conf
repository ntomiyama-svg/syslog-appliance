# /etc/systemd/system/rsyslog.service.d/restart.conf
# syslog-appliance MVP 0 強化フェーズ - T8: rsyslog 自動回復
#
# 役割: rsyslog が異常終了した場合、systemd により自動再起動させる。
#       業務アプライアンスとして「ログ受信が黙って止まる」事態を防ぐ。
#
# 配置先: /etc/systemd/system/rsyslog.service.d/restart.conf
# 反映方法:
#   sudo systemctl daemon-reload
#   （次回 rsyslog 起動時から有効）

# Rocky Linux 9 の systemd では StartLimitBurst / StartLimitIntervalSec は
# [Unit] セクションに記述する必要がある。[Service] に書くと無視される。
[Unit]
# 60 秒以内に 5 回連続失敗したらそれ以上の再起動を諦める
# （無限ループによる CPU 占有や、根本的な設定不良の見落としを防ぐ）
StartLimitBurst=5
StartLimitIntervalSec=60s

[Service]
# 異常終了時のみ再起動（正常停止・手動 stop 時は再起動しない）
Restart=on-failure
# 再起動までの待機時間（5 秒）
RestartSec=5s
