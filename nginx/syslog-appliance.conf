# =============================================================================
# syslog-appliance nginx サイト設定
# 配置先: /etc/nginx/conf.d/syslog-appliance.conf
#
# 構成:
#   - HTTP(80)  → HTTPS(443) への永続リダイレクト
#   - HTTPS(443): 静的ファイル配信 + FastAPI リバースプロキシ
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP サーバーブロック: 全リクエストを HTTPS にリダイレクト
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP → HTTPS への 301 永続リダイレクト
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS サーバーブロック: 本体
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # --- TLS 証明書 ---
    # setup-mvp1-frontend.sh または generate-self-signed-cert.sh が配置する
    ssl_certificate     /etc/syslog-appliance/ssl/server.crt;
    ssl_certificate_key /etc/syslog-appliance/ssl/server.key;

    # TLS バージョン: 1.2 / 1.3 のみ許可（古い 1.0/1.1 は無効化）
    ssl_protocols TLSv1.2 TLSv1.3;

    # 推奨 cipher スイート（TLSv1.3 はデフォルトで安全）
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # TLS セッションキャッシュ（パフォーマンス向上）
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- セキュリティヘッダ ---
    # HSTS: 1 年間 HTTPS を強制（自己署名証明書のため includeSubDomains なし）
    add_header Strict-Transport-Security "max-age=31536000" always;
    # MIME タイプスニッフィング防止
    add_header X-Content-Type-Options nosniff always;
    # クリックジャッキング防止
    add_header X-Frame-Options SAMEORIGIN always;
    # Referrer ポリシー
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --- ログ ---
    access_log /var/log/nginx/syslog-appliance-access.log;
    error_log  /var/log/nginx/syslog-appliance-error.log warn;

    # --- 静的ファイル配信 ---
    # /opt/syslog-appliance/frontend/dist/ を直接配信する
    root /opt/syslog-appliance/frontend/dist;
    index index.html;

    # ルート: index.html フォールバック（シングルページアプリ対応）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- リバースプロキシ共通設定 ---
    # proxy_set_header を location ブロック外で定義できないため、
    # 各 location 内に記述する（または proxy_params include を使う）

    # --- FastAPI API エンドポイント ---
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # タイムアウト設定（長い処理を想定して緩め）
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- ヘルスチェックエンドポイント ---
    location /healthz {
        proxy_pass         http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Swagger UI（FastAPI 自動生成ドキュメント） ---
    location /docs {
        proxy_pass         http://127.0.0.1:8080/docs;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger UI が参照する OpenAPI スキーマ
    location /openapi.json {
        proxy_pass         http://127.0.0.1:8080/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
