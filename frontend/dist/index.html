<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>syslog-appliance 管理画面</title>
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ナビゲーションバー -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-hdd-network me-2"></i>syslog-appliance 管理画面
    </a>
    <div class="d-flex align-items-center ms-auto">
      <span id="nav-system-info" class="text-white-50 small me-3"></span>
      <span class="badge bg-light text-primary" id="nav-status-badge">
        <i class="bi bi-circle-fill text-success me-1" style="font-size:.6rem"></i>稼働中
      </span>
    </div>
  </div>
</nav>

<!-- メインコンテンツ -->
<div class="container-fluid py-4">

  <!-- ページタイトル行 -->
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="mb-0 fw-bold">
      <i class="bi bi-router me-2 text-primary"></i>機器管理
    </h5>
    <button id="btn-add-device" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>新規追加
    </button>
  </div>

  <!-- フィルタ行 -->
  <div class="card mb-3 border-0 shadow-sm">
    <div class="card-body py-2">
      <div class="row g-2 align-items-center">
        <div class="col-auto">
          <label class="col-form-label col-form-label-sm text-muted">グループ</label>
        </div>
        <div class="col-sm-3">
          <select id="filter-group" class="form-select form-select-sm">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="col-form-label col-form-label-sm text-muted">検索</label>
        </div>
        <div class="col-sm-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="filter-search" class="form-control"
                   placeholder="IP・ホスト名・機器名・設置場所">
          </div>
        </div>
        <div class="col-auto ms-auto">
          <span id="device-count" class="text-muted small">0 件</span>
        </div>
      </div>
    </div>
  </div>

  <!-- アラートエリア -->
  <div id="alert-area"></div>

  <!-- 機器一覧テーブル -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-sm mb-0 align-middle" id="devices-table">
          <thead class="table-light">
            <tr>
              <th class="ps-3">IP アドレス</th>
              <th>ホスト名</th>
              <th>機器名</th>
              <th>グループ</th>
              <th>設置場所</th>
              <th class="text-end pe-3">操作</th>
            </tr>
          </thead>
          <tbody id="devices-tbody">
            <tr id="loading-row">
              <td colspan="6" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                読み込み中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div><!-- /container-fluid -->

<!-- ============================================================
     新規追加 / 編集モーダル
     ============================================================ -->
<div class="modal fade" id="device-modal" tabindex="-1" aria-labelledby="device-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="device-modal-label">
          <i class="bi bi-router me-2"></i>機器情報
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <form id="device-form" novalidate>
          <input type="hidden" id="form-device-id">

          <div class="mb-3">
            <label for="form-ip" class="form-label fw-semibold">
              IP アドレス <span class="text-danger">*</span>
            </label>
            <input type="text" class="form-control" id="form-ip"
                   placeholder="例: 192.168.1.100" required
                   pattern="^(\d{1,3}\.){3}\d{1,3}$">
            <div class="invalid-feedback">
              有効な IPv4 アドレスを入力してください（例: 192.168.1.100）
            </div>
          </div>

          <div class="mb-3">
            <label for="form-hostname" class="form-label fw-semibold">ホスト名</label>
            <input type="text" class="form-control" id="form-hostname"
                   placeholder="例: switch-01.example.com">
          </div>

          <div class="mb-3">
            <label for="form-name" class="form-label fw-semibold">機器名</label>
            <input type="text" class="form-control" id="form-name"
                   placeholder="例: コアスイッチ 1F">
          </div>

          <div class="mb-3">
            <label for="form-group" class="form-label fw-semibold">グループ</label>
            <input type="text" class="form-control" id="form-group"
                   placeholder="例: スイッチ、ルーター、サーバー">
          </div>

          <div class="mb-3">
            <label for="form-location" class="form-label fw-semibold">設置場所</label>
            <input type="text" class="form-control" id="form-location"
                   placeholder="例: 1F サーバー室 ラック A">
          </div>

          <div class="mb-3">
            <label for="form-description" class="form-label fw-semibold">説明</label>
            <textarea class="form-control" id="form-description" rows="2"
                      placeholder="機器の詳細説明（任意）"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-lg me-1"></i>キャンセル
        </button>
        <button type="button" class="btn btn-primary" id="btn-save-device">
          <i class="bi bi-check-lg me-1"></i>保存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     削除確認モーダル
     ============================================================ -->
<div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title text-danger" id="delete-modal-label">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>削除確認
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <p class="mb-1">以下の機器を削除します。</p>
        <p class="fw-bold mb-0" id="delete-device-label">—</p>
        <p class="text-muted small mt-1">この操作は取り消せません。</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
          キャンセル
        </button>
        <button type="button" class="btn btn-danger btn-sm" id="btn-confirm-delete">
          <i class="bi bi-trash me-1"></i>削除する
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle (Popper 含む) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXOCKDfAEAfSwAltZ6F6e6ApFU"
        crossorigin="anonymous"></script>

<!-- アプリスクリプト（順序が重要: api.js → devices.js） -->
<script src="js/api.js"></script>
<script src="js/devices.js"></script>
</body>
</html>
