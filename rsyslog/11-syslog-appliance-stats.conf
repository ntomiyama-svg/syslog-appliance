# /etc/rsyslog.d/11-syslog-appliance-stats.conf
#
# rsyslog 受信統計のロギング設定（T6）
#
# 役割:
#   rsyslog の動作統計（受信メッセージ数、処理速度、キュー状態等）を
#   /var/log/syslog-appliance/stats/rsyslog-stats.log に JSON 形式で記録する。
#
# 出力先:
#   /var/log/syslog-appliance/stats/rsyslog-stats.log
#
# 統計の記録間隔:
#   600 秒（10 分）ごとに 1 回記録する。
#
# 主な統計項目:
#   - 受信メッセージ数（imudp.submitted / imtcp.submitted）
#   - 処理キュー状態（main Q enqueued / dequeued / discarded 等）
#   - アクション実行回数・エラー数
#
# オプションの説明:
#   interval   : 統計を記録する間隔（秒）。600 = 10 分。
#   severity   : 統計メッセージの syslog ファシリティ/重要度（7 = debug）。
#   log.syslog : syslog ルーティングへの出力を無効化（"off"）。
#                "on" にすると通常の syslog 処理系に統計が流れてしまい、
#                10-syslog-appliance.conf の remote_raw への誤流入や
#                /var/log/messages への大量書き込みが発生するため "off" を指定。
#   log.file   : 統計を直接書き込むファイルパス。
#   format     : 出力フォーマット。"json" を指定することで各統計が
#                JSON オブジェクト 1 行ずつで出力される（JSON Lines 形式）。
#
# ローテーション:
#   logrotate/syslog-appliance の stats セクションで管理する。
#   30 日分保持・gzip 圧縮・日次ローテーション。
#
# 配置先: /etc/rsyslog.d/11-syslog-appliance-stats.conf
# 自動配置: scripts/setup-mvp0.sh の Step 13 で行う。
#
# 変更時の注意:
#   1. 変更前にバックアップを取ること。
#   2. 変更後は必ず `rsyslogd -N1` で構文チェックを実施すること。
#   3. 構文エラーがなければ `systemctl restart rsyslog` で反映すること。
# ---------------------------------------------------------------------------

module(load="impstats"
       interval="600"
       severity="7"
       log.syslog="off"
       log.file="/var/log/syslog-appliance/stats/rsyslog-stats.log"
       format="json")
