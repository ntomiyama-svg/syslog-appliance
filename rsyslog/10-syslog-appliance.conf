# /etc/rsyslog.d/10-syslog-appliance.conf
#
# syslog-appliance MVP 0 - リモートログ受信用設定
#
# 役割:
#   UDP/TCP 514 で受信した Syslog メッセージを、送信元 IP アドレスと日付ごとに
#   分けて /var/log/syslog-appliance/raw/ 配下に保存する。
#
# 設計上の注意:
#   - imudp/imtcp で受信したログ「だけ」を独自 ruleset (remote_raw) に流す。
#   - ローカル journald 経由のシステムログ（/var/log/messages 等）には
#     一切影響を与えない。
#   - ファイル名は送信元 IP アドレスベースとし、DNS 逆引きに依存しない。
#   - stop により、受信ログがローカルの /var/log/messages へ二重書きされない。
#
# MVP 0 強化フェーズ（2026-05-29 追加）:
#   - T4: $DynaFileCacheSize 200（多数ホスト対応）
#   - T5: ローカル/リモートログの完全分離強化（コメント明確化）
#   - T7: umask=0027 によるファイル権限の厳密化
#
# 配置先: /etc/rsyslog.d/10-syslog-appliance.conf
# 自動配置: scripts/setup-mvp0.sh で行う。手動配置は rsyslog/README.md を参照。
#
# 変更時の注意:
#   1. 変更前にバックアップを取ること。
#   2. 変更後は必ず `rsyslogd -N1` で構文チェックを実施すること。
#   3. 構文エラーがなければ `systemctl restart rsyslog` で反映すること。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# グローバル設定
# ---------------------------------------------------------------------------

# 送信元ホスト名の DNS 逆引きを行わない。
# ファイル名に IP アドレスをそのまま使うため、逆引き失敗によるタイムアウトや
# 意図しないホスト名混入を防ぐ。
#
# T7（ファイル権限の厳密化）:
# umask="0027" を指定することで、rsyslog が作成するファイル・ディレクトリの
# モードが umask の影響を受けなくなる（0027 = 他者の全権限を落とす）。
# fileCreateMode="0640" / dirCreateMode="0750" が意図どおりに反映される。
global(preserveFQDN="off"
       umask="0027")

# T4（DynaFileCacheSize の調整）:
# 動的ファイルキャッシュサイズの拡張。
# 同時に開けるログファイル数の上限で、多数の送信元ホストに対応するため
# デフォルト 10 から 200 に拡張する。
# 注意: この設定はレガシー構文を使う必要がある。
#       RainerScript の global() では設定できないため、別行で記述する。
$DynaFileCacheSize 200

# ---------------------------------------------------------------------------
# UDP 受信モジュールの読み込みと入力定義
# ---------------------------------------------------------------------------
# imudp: UDP でログを受け取るモジュール。
# ポート 514 で受信し、受信したメッセージを ruleset "remote_raw" に渡す。
# ruleset を明示することで、ローカル syslog の処理ルールに混入しない。
module(load="imudp")
input(type="imudp"
      port="514"
      ruleset="remote_raw")

# ---------------------------------------------------------------------------
# TCP 受信モジュールの読み込みと入力定義
# ---------------------------------------------------------------------------
# imtcp: TCP でログを受け取るモジュール。
# ポート 514 で受信し、受信したメッセージを ruleset "remote_raw" に渡す。
# TCP は再送機能があるため、ログの欠落が許容できない場合に有効。
module(load="imtcp")
input(type="imtcp"
      port="514"
      ruleset="remote_raw")

# ---------------------------------------------------------------------------
# 動的ファイルテンプレート
# ---------------------------------------------------------------------------
# 受信ログの保存先パスを「送信元 IP / 日付」で動的に生成するテンプレート。
#
# 出力例:
#   /var/log/syslog-appliance/raw/192.0.2.10/2026-05-28.log
#
# 変数の意味:
#   %fromhost-ip%  : 送信元の IP アドレス（preserveFQDN="off" でも IP になる）
#   %$year%        : ログ受信年（4 桁）
#   %$month%       : ログ受信月（2 桁、ゼロ埋め）
#   %$day%         : ログ受信日（2 桁、ゼロ埋め）
#
# 注意: ディレクトリ（IP 部分）は rsyslog が自動作成する。
#       dirCreateMode と dirOwner/dirGroup の設定が反映される。
template(name="RemoteRawFile"
         type="string"
         string="/var/log/syslog-appliance/raw/%fromhost-ip%/%$year%-%$month%-%$day%.log")

# ---------------------------------------------------------------------------
# リモート受信ログ専用 ruleset
# ---------------------------------------------------------------------------
# T5（ローカル/リモートログの完全分離強化）:
# imudp/imtcp の input 定義で ruleset="remote_raw" を明示しているため、
# UDP/TCP で受信したメッセージだけがここに流れてくる。
# ローカル journald / imjournal 由来のメッセージは本 ruleset を経由せず、
# 従来どおり /var/log/messages 等に流れる。
# 末尾の stop により、本 ruleset で処理されたメッセージは
# 後続のルールに渡らず、二重書き込みも防止する。
# ----------------------------------
ruleset(name="remote_raw") {

    # テンプレート RemoteRawFile で生成したパスにログを書き込む。
    #
    # オプションの説明:
    #   dynaFile        : 動的ファイル名テンプレートを使用することを示す
    #   fileCreateMode  : ログファイルのパーミッション（オクタル）
    #                     0640 = root:root で読み取りは root グループのみ
    #   dirCreateMode   : ディレクトリのパーミッション（オクタル）
    #                     0750 = root:root でディレクトリ参照は root グループのみ
    #   fileOwner/Group : ファイルの所有者・グループ
    #   dirOwner/Group  : ディレクトリの所有者・グループ
    #   asyncWriting    : 非同期書き込みを無効化（off）
    #                     MVP 0 では同期書き込みで確実性を優先する。
    #                     高負荷環境では "on" に変更してパフォーマンスを改善できる。
    action(type="omfile"
           dynaFile="RemoteRawFile"
           fileCreateMode="0640"
           dirCreateMode="0750"
           fileOwner="root"
           fileGroup="root"
           dirOwner="root"
           dirGroup="root"
           asyncWriting="off")

    # stop: この ruleset での処理を終了し、後続のルール（/var/log/messages 等）に
    # メッセージを流さない。受信ログがローカルログへ二重書きされることを防ぐ。
    stop
}
